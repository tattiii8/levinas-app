name: Deploy LEVINAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to LEVINAS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LEVINAS_HOST }}
          username: ubuntu
          key: ${{ secrets.LEVINAS_SSH_KEY }}

          script: |
            set -e

            cd /opt/levinas/redmine

            echo "== Check working tree =="
            git status --short

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree is not clean."
              exit 1
            fi

            echo "== Pull latest code =="
            git pull --ff-only origin main

            echo "== Validate compose file =="
            docker compose config -q

            echo "== Deploy =="
            docker compose up -d

            echo "== Container status =="
            docker compose ps

            echo "== Wait for Redmine =="

            for i in $(seq 1 30); do
              if docker compose exec -T redmine \
                curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                echo "Redmine is healthy."
                exit 0
              fi

              echo "Waiting for Redmine... ($i/30)"
              sleep 5
            done

            echo "ERROR: Redmine did not become ready."
            docker compose logs --tail=100 redmine
            exit 1
