name: Deploy LEVINAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to LEVINAS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LEVINAS_HOST }}
          username: ubuntu
          key: ${{ secrets.LEVINAS_SSH_KEY }}

          script: |
            set -e

            cd /opt/levinas/redmine

            echo "== Check working tree =="
            git status --short

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree is not clean."
              exit 1
            fi

            echo "== Pull latest code =="
            git pull --ff-only origin main

            echo "== Validate compose file =="
            docker compose config -q

            echo "== Deploy =="
            docker compose up -d

            echo "== Container status =="
            docker compose ps
